{% extends "base.html" %}

{% block content %}

<div class="hero">
    <h1>Create Trainee</h1>
    <p class="muted">
        Admin can create a trainee and assign the trainee to a specific training center.
    </p>
</div>

<div class="panel">
    <form method="post">

        <div class="form-grid">

            <div class="field">
                <label>Name *</label>
                <input name="name" required>
            </div>

            <div class="field">
                <label>Email *</label>
                <input type="email" name="email" required>
            </div>

            <div class="field">
                <label>Phone</label>
                <input name="phone">
            </div>

            <div class="field">
                <label>District</label>
                <input name="district">
            </div>

            <div class="field">
                <label>Education</label>
                <input name="education">
            </div>

            <div class="field">
                <label>Course</label>
                <input name="course">
            </div>

            <div class="field full">
                <label>Current Skills</label>
                <input name="skills" placeholder="Python, Excel, SQL">
            </div>

            <div class="field full">
                <label>Training Center</label>

                <select name="training_center_id">
                    <option value="">Not assigned</option>

                    {% for c in centers %}
                    <option value="{{ c.id }}">
                        {{ c.center_code }} - {{ c.center_name }}
                    </option>
                    {% endfor %}

                </select>
            </div>

            <div class="field">
                <label>Provider</label>
                <input name="provider">
            </div>

            <div class="field">
                <label>Login Password</label>
                <input type="password" name="password">
            </div>

            <div class="field">
                <label>Attendance %</label>
                <input
                    name="attendance"
                    type="number"
                    step="0.1"
                    min="0"
                    max="100"
                    value="0"
                >
            </div>

            <div class="field">
                <label>Assessment</label>
                <input
                    name="assessment"
                    type="number"
                    step="0.1"
                    min="0"
                    max="100"
                    value="0"
                >
            </div>

            <div class="field">
                <label>Certification</label>

                <select name="certification">
                    <option>Not Certified</option>
                    <option>Certified</option>
                </select>
            </div>

            <div class="field">
                <label>Status</label>

                <select name="status">
                    <option>Training Completed</option>
                    <option>Employed</option>
                    <option>Self-employed</option>
                    <option>Not Placed</option>
                </select>
            </div>

            <div class="full">
                <button class="btn" type="submit">
                    Create Trainee + ID
                </button>
            </div>

        </div>

    </form>
</div>

{% endblock %}
